name: Signed Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: meshlink-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and verify signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MESHLINK_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MESHLINK_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MESHLINK_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MESHLINK_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::MESHLINK_RELEASE_KEYSTORE_BASE64 is required"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::MESHLINK_RELEASE_STORE_PASSWORD is required"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::MESHLINK_RELEASE_KEY_PASSWORD is required"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::MESHLINK_RELEASE_KEY_ALIAS is required"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/meshlink-release-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Release keystore restored outside the repository."

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/meshlink-release-upload.jks
          STORE_PASSWORD: ${{ secrets.MESHLINK_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MESHLINK_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MESHLINK_RELEASE_KEY_ALIAS }}
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify signature and create checksums
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee app/build/outputs/apk/release/signature-verification.txt
          AAPT="$BUILD_TOOLS/aapt"
          PACKAGE_INFO="$("$AAPT" dump badging "$APK" | head -n 1)"
          APP_ID="$(printf '%s' "$PACKAGE_INFO" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          VERSION_CODE="$(printf '%s' "$PACKAGE_INFO" | sed -n "s/.*versionCode='\\([^']*\\)'.*/\\1/p")"
          VERSION_NAME="$(printf '%s' "$PACKAGE_INFO" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")"
          test "$APP_ID" = "com.aistudio.meshlink.rx7kqm"
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          {
            echo "applicationId=$APP_ID"
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "buildType=release"
            echo "commit=$SOURCE_SHA"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > app/build/outputs/apk/release/build-info.txt
          cat app/build/outputs/apk/release/build-info.txt >> "$GITHUB_STEP_SUMMARY"
          cat app/build/outputs/apk/release/signature-verification.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and verification evidence
        uses: actions/upload-artifact@v5
        with:
          name: meshlink-signed-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/build-info.txt
            app/build/outputs/apk/release/signature-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/build-info.txt
            app/build/outputs/apk/release/signature-verification.txt
