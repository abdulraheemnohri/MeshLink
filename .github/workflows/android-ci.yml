name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report toolchain
        run: |
          java -version
          ./gradlew --no-daemon --version

      - name: Restore stable debug signing key or create temporary CI key
        id: debug-signing
        env:
          MESHLINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.MESHLINK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MESHLINK_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$MESHLINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "A stable owner-provided debug signing key is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::No MESHLINK_DEBUG_KEYSTORE_BASE64 secret is configured. This APK is for fresh installs only; it may not update an existing MeshLink installation."
            echo "No stable debug key secret is configured. This artifact is fresh-install only and may not update an existing install." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Verify Room schema export
        run: |
          find app/schemas -maxdepth 4 -type f -print
          test -n "$(find app/schemas -type f -name '9.json' -print -quit)" || {
            echo "::error::Room schema version 9 JSON was not generated."
            exit 1
          }

      - name: Upload Room schema snapshot
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-room-schema
          path: app/schemas/com.example.data.database.AppDatabase/9.json
          if-no-files-found: error
          retention-days: 14

      - name: Write APK build information
        env:
          SIGNING_MODE: ${{ steps.debug-signing.outputs.mode }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "applicationId=com.aistudio.meshlink.rx7kqm"
            echo "versionName=1.1"
            echo "versionCode=2"
            echo "buildType=debug"
            echo "signingMode=$SIGNING_MODE"
            echo "commit=$SOURCE_SHA"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > app/build/outputs/apk/debug/build-info.txt
          cat app/build/outputs/apk/debug/build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK and build information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
            app/schemas/
          if-no-files-found: error
          retention-days: 14

  commit-schema:
    name: Commit generated Room schema snapshot
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated schema snapshot
        uses: actions/download-artifact@v4
        with:
          name: meshlink-room-schema
          path: ${{ runner.temp }}/room-schema

      - name: Commit schema snapshot if changed
        run: |
          set -euo pipefail
          SCHEMA_SOURCE="$(find "$RUNNER_TEMP/room-schema" -type f -name '9.json' -print -quit)"
          test -n "$SCHEMA_SOURCE"
          mkdir -p app/schemas/com.example.data.database.AppDatabase
          cp "$SCHEMA_SOURCE" app/schemas/com.example.data.database.AppDatabase/9.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.example.data.database.AppDatabase/9.json
          if ! git diff --cached --quiet; then
            git commit -m "build: commit Room schema version 9 snapshot"
            git push origin main
          else
            echo "Room schema version 9 snapshot is already current."
          fi
