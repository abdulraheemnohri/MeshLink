name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Android project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Report toolchain
        run: |
          java -version
          gradle --version

      - name: Generate and verify official Gradle Wrapper
        run: |
          gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon --version

      - name: Commit generated wrapper to main
        id: wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          WRAPPER_DIR="$RUNNER_TEMP/meshlink-wrapper"
          mkdir -p "$WRAPPER_DIR/gradle/wrapper"
          cp gradlew gradlew.bat "$WRAPPER_DIR/"
          cp gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties "$WRAPPER_DIR/gradle/wrapper/"
          git fetch origin main
          git checkout -B main origin/main
          cp "$WRAPPER_DIR/gradlew" "$WRAPPER_DIR/gradlew.bat" .
          cp "$WRAPPER_DIR/gradle/wrapper/gradle-wrapper.jar" "$WRAPPER_DIR/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m "build: add official Gradle 9.3.1 wrapper"
            git push origin main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Gradle Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14

      - name: Restore stable debug signing key or create temporary CI key
        id: debug-signing
        env:
          MESHLINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.MESHLINK_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$MESHLINK_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$MESHLINK_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null
            echo "mode=stable" >> "$GITHUB_OUTPUT"
            echo "A stable owner-provided debug signing key is configured." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "mode=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::No MESHLINK_DEBUG_KEYSTORE_BASE64 secret is configured. This APK is for fresh installs only; it may not update an existing MeshLink installation."
            echo "No stable debug key secret is configured. This artifact is fresh-install only and may not update an existing install." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Verify Room schema export
        run: |
          find app/schemas -maxdepth 4 -type f -print
          test -n "$(find app/schemas -type f -name '9.json' -print -quit)" || {
            echo "::error::Room schema version 9 JSON was not generated."
            exit 1
          }

      - name: Commit generated Room schema snapshot to main
        id: schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          SCHEMA_SOURCE="$(find app/schemas -type f -name '9.json' -print -quit)"
          test -n "$SCHEMA_SOURCE"
          cp "$SCHEMA_SOURCE" "$RUNNER_TEMP/room-schema-9.json"
          rm -rf app/schemas/com.example.data.database.AppDatabase
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p app/schemas/com.example.data.database.AppDatabase
          cp "$RUNNER_TEMP/room-schema-9.json" app/schemas/com.example.data.database.AppDatabase/9.json
          git add app/schemas/com.example.data.database.AppDatabase/9.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: commit Room schema version 9 snapshot"
            git push origin main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write APK build information
        env:
          SIGNING_MODE: ${{ steps.debug-signing.outputs.mode }}
          SOURCE_SHA: ${{ steps.schema.outputs.source_sha || steps.wrapper.outputs.source_sha || github.sha }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          {
            echo "applicationId=com.aistudio.meshlink.rx7kqm"
            echo "versionName=1.1"
            echo "versionCode=2"
            echo "buildType=debug"
            echo "signingMode=$SIGNING_MODE"
            echo "commit=$SOURCE_SHA"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } > app/build/outputs/apk/debug/build-info.txt
          cat app/build/outputs/apk/debug/build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK and build information
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/build-info.txt
            app/schemas/
          if-no-files-found: error
          retention-days: 14
