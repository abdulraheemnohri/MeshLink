name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-wrapper.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Generate official Gradle 9.3.1 wrapper files
        run: |
          gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
      - name: Upload generated wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-gradle-wrapper-bootstrap
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 2
